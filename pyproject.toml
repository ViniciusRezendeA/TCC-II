[project]
name = "mcp-pipeline"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Vinicius Rezende Arantes De Araujo Moreira", email = "vinicius.rezende.ext@ipiranga.ipiranga" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "tree-sitter==0.23.2",
    "tree-sitter-c-sharp==0.23.1",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-python==0.23.6",
    "tree-sitter-typescript==0.23.2",
]

[project.scripts]
mcp-pipeline = "mcp_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
