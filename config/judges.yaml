# Júri multi-provedor da Etapa 3 (LLM-as-a-Judge). Cada entrada é instanciada por
# evaluation/judges/registry.py::load_judges() via PROVIDER_CLASSES -- adicionar,
# remover ou trocar de modelo é editar este arquivo, sem tocar em código.
#
# Juízes locais (llama.cpp) + Gemini (cloud, free tier) + DeepSeek (cloud, PAGO -- ver
# deepseek_judge.py) -- Claude e GPT não são usados neste projeto.
#
# model_id do Google: gemini-2.5-flash/-lite (confirmados na Fase 0, 2026-08-19) foram
# descontinuados para chaves novas -- a API responde 404 "no longer available to new
# users" e recomenda estes substitutos diretos, confirmados em client.models.list()
# em 2026-09-09: gemini-3.6-flash (era gemini-2.5-flash) e gemini-3.5-flash-lite
# (era gemini-2.5-flash-lite).
# requests_per_minute: paces GeminiJudge's own calls (see gemini_judge.py::_RateLimiter) so
# --concurrency alone never bursts past the free-tier RPM -- values below are the real
# per-account limits from https://aistudio.google.com/rate-limit on 2026-09-09, minus a
# safety margin (limits aren't guaranteed and can shift). Confirmed necessary: even
# --concurrency 3 produced 429s on gemini-3.5-flash-lite (nominal 15 RPM) because fast
# responses let several requests land in the same 60s window.
judges:
  - id: gemini-3.6-flash
    provider: google
    model_id: gemini-3.6-flash
    enabled: false
    requests_per_minute: 4  # nominal 5 RPM

  - id: gemini-3.5-flash-lite
    provider: google
    model_id: gemini-3.5-flash-lite
    enabled: true
    requests_per_minute: 12  # nominal 15 RPM

  # DeepSeek (cloud, PAGO -- sem free tier de API confirmado, ver deepseek_judge.py).
  # Desabilitado por padrão de propósito: diferente dos outros juízes acima, cada chamada
  # tem custo real (DeepSeek-V4.1-Flash: ~$0,15/$0,60 por 1M tokens off-peak, ~$0,30/$1,20
  # peak -- ver api-docs.deepseek.com/quick_start/pricing). Habilitar via
  # `--judges deepseek-flash` num lote pequeno primeiro, nunca `enabled: true` direto.
  - id: deepseek-flash
    provider: deepseek
    model_id: deepseek-flash
    enabled: false

  # Juízes locais (llama.cpp)
  - id: llama-uncensored
    provider: llama
    model_id: llama-uncensored
    enabled: false

  - id: qwen2.5-14b-instruct
    provider: qwen
    model_id: qwen2.5-14b-instruct
    enabled: true

# Testes (o modelo é sempre escolhido via --judges, nunca hardcoded em script):
# python -m mcp_pipeline.pipeline.run_step3 --judges llama-uncensored --limit 5
# python -m mcp_pipeline.pipeline.run_step3 --judges qwen2.5-14b-instruct --limit 5
# python -m mcp_pipeline.pipeline.run_step3 --judges qwen2.5-14b-instruct,llama-uncensored --limit 20
# python -m mcp_pipeline.pipeline.run_step3 --judges deepseek-flash --limit 5  # PAGO, lote pequeno primeiro