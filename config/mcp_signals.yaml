# Sinais usados para identificar repositórios candidatos a "servidor MCP" no GitHub
# (Etapa 1 do TCC). Cada entrada abaixo vira uma query GraphQL separada; os
# resultados são unidos (por id de repositório) e deduplicados em
# `collection/dedupe_rank.py`.
#
# Mantido como dados (não hardcoded em Python) porque o ecossistema MCP está em
# mudança ativa de nomes de pacote/SDK no momento em que este arquivo foi criado
# (2026-08). Revisar antes de cada rodada completa da Etapa 1 — ver
# `scripts/verify_sdk_syntax.py`.

# Tópicos do GitHub (qualificador `topic:`), busca via GraphQL repository search.
#
# O tópico genérico "mcp" foi removido em 2026-08-18 após validação da primeira
# rodada real: sozinho, respondia por 21% do pool (387/1873) e mais da metade
# do top-206 por estrelas, dominado por plataformas grandes de IA/agentes que
# apenas mencionam ou integram MCP como um recurso a mais (ex: JavaGuide,
# JeecgBoot, siyuan-note, "ECC"), não servidores MCP focados. Ver validação
# no histórico da conversa/plano — não reintroduzir sem um filtro adicional.
topics:
  - mcp-server
  - model-context-protocol

# Sinais textuais (qualificador `in:readme,description`), busca via GraphQL
# repository search — NÃO usa a API de Code Search (REST), que fica desligada
# por padrão em `github/rest_code_search.py`.
text_signals:
  - "@modelcontextprotocol/sdk" # pacote npm oficial, geração v1 (TS/JS)
  - "@modelcontextprotocol/server" # pacote npm oficial, geração v2 (TS/JS, split)
  - "FastMCP" # classe de alto nível do SDK Python, geração v1
  - "mcp.server.fastmcp" # caminho de import do SDK Python, geração v1
  - "io.modelcontextprotocol.sdk" # groupId Maven do SDK oficial Java
  - "ModelContextProtocol" # pacote NuGet do SDK oficial C#

# Mesmos sinais acima, mas buscados dentro de arquivos de manifesto de
# biblioteca (dependência declarada), não em README/description — via REST
# Code Search API (limitada a 10 req/min, ver github/rest_code_search.py e
# github/search_manifest.py), já que a busca de repositórios via GraphQL não
# tem qualificador `filename:`/`in:file`. Cada hit é rehidratado via GraphQL
# (REPO_BY_NAME_QUERY) antes de entrar no pool, para ter os mesmos campos
# (stars, fork, linguagem) que as outras fontes.
#
# build_manifest_query_string (github/queries.py) chegou a restringir cada
# busca com `path:/` (raiz do repositório) — sem isso, "@modelcontextprotocol/sdk"
# filename:package.json sozinho batia total_count=103424, porque o próprio
# package.json commitado do pacote dentro de node_modules/ casa trivialmente
# (seu campo "name" é o próprio sinal); com path:/ caía para 52352. Esse
# qualificador foi removido depois (deixava de casar manifesto legítimo
# aninhado em subdiretório de monorepo, ex: packages/foo/package.json) — a
# query atual não usa mais `path:/`, então os total_count deste bloco (aqui
# e abaixo) são um registro histórico da validação, não o comportamento
# atual da query. Testado contra um token real: `fork:false` dá erro 422
# nesse endpoint (diferente da busca de repositórios) e `-path:DIR`/
# `stars:>=N` são no-ops silenciosos — ver docstring de
# build_manifest_query_string para os números completos.
# `requirements.txt` foi removido dos sinais Python abaixo pelo mesmo motivo
# que um lockfile é evitado: gerado via `pip freeze`, lista a árvore de
# dependências transitiva inteira, então casaria qualquer repo que dependa
# de algo que dependa de FastMCP, não só quem usa o SDK diretamente.
# pyproject.toml/setup.py são escritos à mão e continuam como sinal de
# dependência direta.
#
# Mesmo com path:/ ainda ativo (ver nota histórica acima), 3 dos 9 pares
# (signal, arquivo) ficavam bem acima do limite de 1000 resultados do
# GitHub Search — nesses casos o REST Code
# Search só devolve uma amostra de até 1000 hits em ordem de "best match"
# (não por estrelas), não a busca exaustiva que os outros sinais têm:
#   - "@modelcontextprotocol/sdk" + package.json: total_count=52352 (52x)
#   - "FastMCP" + pyproject.toml: total_count=12928 (13x)
#   - "@modelcontextprotocol/server" + package.json: total_count=1804 (1.8x)
# Os outros pares ficam abaixo de 1000 (busca exaustiva real). Mantidos
# por ora — mesmo incompletos, ainda contribuem candidatos reais que passam
# pelo filtro de estrelas/fork/linguagem em dedupe_rank.py — mas revisar
# antes de reportar cobertura no TCC como exaustiva para esses 3.
#
# `build.gradle.kts` (Kotlin DSL do Gradle) foi adicionado a
# io.modelcontextprotocol.sdk após validar contra um token real:
# total_count=36, bem abaixo do cap, sinal limpo (mesmo groupId Maven exato
# já usado em pom.xml/build.gradle). Testado e descartado: sinal Python
# "mcp" (nome real do pacote PyPI do SDK oficial, mais preciso que
# "FastMCP"/"mcp.server.fastmcp" que são nome de classe/caminho de import,
# não de dependência) — mas é curto demais para o tokenizer do Code Search
# isolar como dependência: total_count=57856 em pyproject.toml e 2040 em
# setup.py mesmo com path:/ ainda ativo, inviável. `packages.config` (NuGet
# legado) para ModelContextProtocol: total_count=0, sem valor.
manifest_signals_v2:
  - signal: "@modelcontextprotocol/node"
    file_qualifiers: ["filename:package.json"]
  # JavaScript / TypeScript
  - signal: "@modelcontextprotocol/server"
    file_qualifiers: ["filename:package.json"]

  # JavaScript / TypeScript
  - signal: "@modelcontextprotocol/sdk"
    file_qualifiers:
      - "filename:package.json"


  # Python
  - signal: "mcp"
    file_qualifiers:
      - "filename:pyproject.toml"
      - "filename:requirements.txt"
      - "filename:setup.py"
      - "filename:setup.cfg"

  # Python - FastMCP
  - signal: "fastmcp"
    file_qualifiers:
      - "filename:pyproject.toml"
      - "filename:requirements.txt"
      - "filename:setup.py"
      - "filename:setup.cfg"

  # Java
  - signal: "io.modelcontextprotocol"
    file_qualifiers:
      - "filename:pom.xml"
      - "filename:build.gradle"
      - "filename:build.gradle.kts"

  # Kotlin / Java
  - signal: "io.modelcontextprotocol"
    file_qualifiers:
      - "filename:build.gradle.kts"
      - "filename:build.gradle"
      - "filename:pom.xml"


  # C#
  - signal: "ModelContextProtocol"
    file_qualifiers:
      - "extension:csproj"

  # Go
  - signal: "modelcontextprotocol"
    file_qualifiers:
      - "filename:go.mod"

  # Rust
  - signal: "rmcp"
    file_qualifiers:
      - "filename:Cargo.toml"

  # Rust - official-ish ecosystem package naming
  - signal: "modelcontextprotocol"
    file_qualifiers:
      - "filename:Cargo.toml"

  # Swift
  - signal: "ModelContextProtocol"
    file_qualifiers:
      - "filename:Package.swift"

  # Ruby
  - signal: "mcp"
    file_qualifiers:
      - "filename:Gemfile"
      - "filename:gemspec"

  # PHP
  - signal: "modelcontextprotocol"
    file_qualifiers:
      - "filename:composer.json"

  # Dart
  - signal: "mcp"
    file_qualifiers:
      - "filename:pubspec.yaml"

  # Elixir
  - signal: "mcp"
    file_qualifiers:
      - "filename:mix.exs"

  # Lua
  - signal: "mcp"
    file_qualifiers:
      - "filename:rockspec"

# Linguagens-alvo (normalizado contra `primaryLanguage.name` no lado do cliente,
# não embutido na query GraphQL — ver justificativa no plano de implementação).
target_languages:
  - Python
  - JavaScript
  - TypeScript
  - Java
  - "C#"
  - Go
  - Rust
  - Ruby
  - Dart
  - Kotlin
 

min_stars: 100
top_n: 206

# Aplicado pós-extração (Etapa 2), não no filtro de candidatos da Etapa 1: o
# número de tools só existe depois do clone + tree-sitter, então isto decide
# quais repos já clonados/processados entram em dataset.jsonl, não quais são
# buscados/selecionados no GitHub. Ver assemble_dataset.py.
min_tools: 1

# Guarda-corpo: se o repositoryCount de alguma sub-query individual se aproximar
# deste valor, é sinal de que o sinal textual está amplo demais (GitHub Search
# não pagina além de 1000 resultados por query).
result_count_warning_threshold: 900
